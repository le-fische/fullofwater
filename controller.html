<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>RSR Controller</title>
  <link rel="stylesheet" href="/src/controller/controller.css">
</head>
<body>
  <div id="app-container"></div>

  <!-- Automotive Engine Start Push-Button Gate -->
  <div id="gate-overlay">
    <div class="engine-start-assembly">
      <button id="btn-start-drive" class="engine-start-btn" aria-label="Engine Start">
        <div class="start-btn-outer-ring">
          <div class="start-btn-core">
            <svg class="engine-power-symbol" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="24" cy="24" r="16" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="82 24" stroke-dashoffset="12"/>
              <line x1="24" y1="6" x2="24" y2="23" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
            </svg>
            <div class="start-btn-inner-glow"></div>
          </div>
        </div>
      </button>
    </div>
  </div>

  <script type="module" src="/src/controller/controller.ts"></script>
</body>
</html>
